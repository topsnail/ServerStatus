# 生产编排：配置与统计落在仓库外的 data/，部署不会覆盖。
# 镜像由 scripts/deploy.sh 用 `docker build -f Dockerfile.server` 构建
#（避免 Compose v5 bake + --project-directory 把 context/dockerfile 路径解析错）。
# 在项目根目录执行：
#   docker build -f Dockerfile.server -t serverstatus:local .
#   docker compose --project-directory . -f deploy/docker-compose.yml up -d

services:
  serverstatus-server:
    image: serverstatus:local
    container_name: serverstatus-server
    restart: unless-stopped
    # 下列相对路径相对本文件所在目录（deploy/）
    env_file:
      - ../.env
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      CONFIG_PATH: /app/config/config.json
      STATS_PATH: /app/data/stats.json
      WEB_DIR: /app/web
      HTTP_ADDR: ":80"
      AGENT_ADDR: ":35601"
      TZ: "${TZ:-Asia/Shanghai}"
      INSECURE_CALLBACK_TLS: "${INSECURE_CALLBACK_TLS:-false}"
      VERBOSE: "${VERBOSE:-false}"
    volumes:
      - ../data/config.json:/app/config/config.json
      - ../data:/app/data
    ports:
      # WebUI / API：仅本机，给 1Panel 反代
      - "127.0.0.1:8080:80"
      # Agent 上报：需对公网或客户端可达
      - "35601:35601"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
